name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Run a script, and use the global package
        run: |
          sudo podman exec circuit-nodejs bash -lc '
            set -eux
            node -p process.version | grep -x v26.13.0
            echo "console.log(\"sum\", [1,2,3].reduce((a,b)=>a+b))" > /tmp/t.js
            node /tmp/t.js | grep -x "sum 6"
            semver -r "^1.0.0" 1.2.3 | grep -x 1.2.3
            ! semver -r "^2.0.0" 1.2.3
            npm prefix -g | grep -x /usr/local
            npm ls -g --depth=0 | grep semver@7.8.5
          '
      - name: Move to another Node.js, and see the global package install again
        working-directory: examples/local
        run: |
          sudo podman exec circuit-nodejs touch /usr/local/lib/node_modules/semver/old-install
          cat > override.tf <<'EOF'
          module "nodejs" {
            node_version = "24.22.2"
            checksums = {
              x64   = "361718c444e49af2ca5a110c83ba6a8901143f23ab285ebbef0341f391f482a9"
              arm64 = "95c264150aceb7f3437a29fd6984924f5f8d1511ea3cbd6c508b83f6c555dae2"
            }
          }
          EOF
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-nodejs bash -lc '
            set -eux
            node -p process.version | grep -x v24.22.2
            semver -r "^1.0.0" 1.2.3 | grep -x 1.2.3
            ! test -e /usr/local/lib/node_modules/semver/old-install
          '
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
